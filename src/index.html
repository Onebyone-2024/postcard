<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <script src="https://cdn.tailwindcss.com"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Label Generator</title>
</head>

<body class="min-h-screen bg-slate-50">
  <div class="max-w-2xl mx-auto px-6 py-12">

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">

      <div class="mb-8">
        <h1 class="text-3xl font-bold text-slate-900">
          Label Generator
        </h1>

        <p class="mt-2 text-slate-600">
          Upload a CSV file and generate labels in Google Slides.
        </p>
      </div>

      <div class="space-y-6">

        <div>
          <label
            for="slideUrl"
            class="block text-sm font-medium text-slate-700 mb-2"
          >
            Google Slides URL<span class="text-red-700">*</span>
          </label>

          <input
            id="slideUrl"
            type="url"
            required
            placeholder="https://docs.google.com/presentation/d/..."
            class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          >
        </div>

        <div>
          <label
            for="csvFile"
            class="block text-sm font-medium text-slate-700 mb-2"
          >
            CSV File<span class="text-red-700">*</span>
          </label>

          <input
            id="csvFile"
            type="file"
            accept=".csv"
            required
            class="block w-full text-sm text-slate-600
                   file:mr-4
                   file:rounded-lg
                   file:border-0
                   file:bg-blue-600
                   file:px-4
                   file:py-2
                   file:text-white
                   file:cursor-pointer
                   hover:file:bg-blue-700"
          >
        </div>

        <p class="mt-2 text-sm">
          <a
            href="data:text/csv;charset=utf-8,Contact%0AJohn%20Doe%0AJane%20Smith%0AMichael%20Tan%0ASarah%20Lee"
            download="Template.csv"
            class="text-blue-600 hover:underline"
          >
            Download Template.csv
          </a>
        </p>

        <button
          id="generateBtn"
          onclick="generate()"
          class="w-full rounded-lg bg-blue-600 px-4 py-3 font-medium text-white hover:bg-blue-700 transition"
        >
          Generate Labels
        </button>

        <div
          id="status"
          class="hidden rounded-lg border px-4 py-3 text-sm"
        ></div>

      </div>
    </div>
  </div>

  <script>
    function showStatus(message, type = 'info') {
      const status = document.getElementById('status');

      status.classList.remove(
        'hidden',
        'border-green-200',
        'bg-green-50',
        'text-green-700',
        'border-red-200',
        'bg-red-50',
        'text-red-700',
        'border-blue-200',
        'bg-blue-50',
        'text-blue-700'
      );

      if (type === 'success') {
        status.classList.add(
          'border-green-200',
          'bg-green-50',
          'text-green-700'
        );
      } else if (type === 'error') {
        status.classList.add(
          'border-red-200',
          'bg-red-50',
          'text-red-700'
        );
      } else {
        status.classList.add(
          'border-blue-200',
          'bg-blue-50',
          'text-blue-700'
        );
      }

      status.innerHTML = message;
    }

    function generate() {
      const slideUrl =
        document.getElementById('slideUrl').value.trim();

      const fileInput =
        document.getElementById('csvFile');

      const button =
        document.getElementById('generateBtn');

      if (!slideUrl) {
        showStatus(
          'Please enter a Google Slides URL.',
          'error'
        );
        return;
      }

      if (!fileInput.files.length) {
        showStatus(
          'Please select a CSV file.',
          'error'
        );
        return;
      }

      button.disabled = true;
      button.textContent = 'Generating...';

      showStatus(
        'Uploading CSV and generating slides...',
        'info'
      );

      const reader = new FileReader();

      reader.onload = function(e) {
        const csvText = e.target.result;

        google.script.run
          .withSuccessHandler(function(result) {
            button.disabled = false;
            button.textContent = 'Generate Labels';

            if (result.success) {
              showStatus(
                `
                Labels generated successfully.<br><br>
                <a
                  href="${result.slideUrl}"
                  target="_blank"
                  class="font-semibold underline"
                >
                  Open Presentation
                </a>
                `,
                'success'
              );
            } else {
              showStatus(
                result.error,
                'error'
              );
            }
          })
          .withFailureHandler(function(error) {
            button.disabled = false;
            button.textContent = 'Generate Labels';

            showStatus(
              error.message || 'Unexpected error.',
              'error'
            );
          })
          .generateLabels(slideUrl, csvText);
      };

      reader.readAsText(fileInput.files[0]);
    }
  </script>
</body>
</html>
